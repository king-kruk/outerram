name: ci

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run full Python/macOS/runtime validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Pre-public history privacy
        if: github.event.repository.private == true
        run: python scripts/pre-public-history-gate.py
      - name: Legal policy
        run: python scripts/legal-gate.py --mode internal --json
      - name: Pre-public release policy
        if: github.event.repository.private == true
        run: python scripts/legal-gate.py --mode pre-public --json
      - name: Repository security policy
        run: python scripts/security-gate.py
      - name: Require DCO sign-off on external contributions
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if ! git cat-file -e "${base}:DCO.md" 2>/dev/null; then
            echo "DCO policy is being introduced by this PR; enforcement starts after merge."
            exit 0
          fi
          bad=0
          while read -r sha; do
            if ! git show -s --format=%B "$sha" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "Missing Signed-off-by in $sha"
              bad=1
            fi
          done < <(git rev-list "${base}..${head}")
          exit "$bad"
      - run: python -m pip install -U pip build
      - run: python -m pip install -e '.[dev]'
      - name: Static security analysis
        run: |
          python -m pip install 'bandit==1.9.4'
          python -m bandit -q -r src/outerram src/stretchmlx scripts -lll
      - run: python -m pytest -q
      - run: python -m compileall -q src/outerram src/stretchmlx tests scripts
      - run: ./scripts/smoke-synthetic.sh
      - run: python -m build
      - name: Verify wheel legal metadata
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$(ls dist/outerram-*.whl | head -1)"
          python scripts/verify-wheel-legal-metadata.py "$WHEEL"
      - name: Validate wheel, dependencies, vulnerability status and SBOM
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/outerram-wheel-test
          /tmp/outerram-wheel-test/bin/python -m pip install -U pip
          /tmp/outerram-wheel-test/bin/python -m pip install dist/outerram-*.whl
          VERSION="$(/tmp/outerram-wheel-test/bin/python -c 'import outerram; print(outerram.__version__)')"
          /tmp/outerram-wheel-test/bin/outerram --version
          /tmp/outerram-wheel-test/bin/stretchmlx --version
          /tmp/outerram-wheel-test/bin/outerram pins --json
          /tmp/outerram-wheel-test/bin/python -m pip check
          /tmp/outerram-wheel-test/bin/python -m pip freeze --all > dependency-freeze.txt
          /tmp/outerram-wheel-test/bin/python scripts/dependency-license-report.py \
            --overrides legal/LICENSE_OVERRIDES.json \
            --output dependency-licenses.json \
            --fail-on-risk --fail-on-unknown
          /tmp/outerram-wheel-test/bin/python scripts/generate-sbom.py \
            --inventory dependency-licenses.json \
            --root-name outerram \
            --root-version "$VERSION" \
            --output SBOM.cdx.json
          python -m venv /tmp/outerram-audit-tools
          /tmp/outerram-audit-tools/bin/python -m pip install 'pip-audit==2.10.1'
          SITE_PACKAGES="$(/tmp/outerram-wheel-test/bin/python -c 'import site; print(site.getsitepackages()[0])')"
          /tmp/outerram-audit-tools/bin/pip-audit --path "$SITE_PACKAGES" --progress-spinner off
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
        with:
          name: outerram-dist
          path: |
            dist/*
            dependency-licenses.json
            dependency-freeze.txt
            SBOM.cdx.json

  test-linux-compat:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q src/outerram src/stretchmlx tests scripts
      - run: ./scripts/smoke-synthetic.sh

  upstream-contracts:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e .
      - run: outerram upstream-check --json

  test-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ./scripts/smoke-synthetic.sh

  runtime-license-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        runtime: [resident, dense-stream, moe-stream]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e .
      - name: Export tested runtime pins
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from outerram.runtime_pins import MLX_FLASH_REF, MLX_LM_REF, STREAMLX_REF
          print(f"MLX_LM_REF={MLX_LM_REF}")
          print(f"MLX_FLASH_REF={MLX_FLASH_REF}")
          print(f"STREAMLX_REF={STREAMLX_REF}")
          PY
      - name: Install exact pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.runtime }}' in
            resident)
              python -m pip install -U "git+https://github.com/ml-explore/mlx-lm.git@${MLX_LM_REF}"
              ;;
            dense-stream)
              python -m pip install -U "git+https://github.com/matt-k-wong/mlx-flash.git@${MLX_FLASH_REF}"
              python -m pip install -U "git+https://github.com/ml-explore/mlx-lm.git@${MLX_LM_REF}"
              ;;
            moe-stream)
              git clone --filter=blob:none https://github.com/srcterm/streamlx.git /tmp/streamlx
              git -C /tmp/streamlx checkout --detach "${STREAMLX_REF}"
              python -m pip install -e /tmp/streamlx
              python -m pip install -U "git+https://github.com/ml-explore/mlx-lm.git@${MLX_LM_REF}"
              ;;
          esac
          python -m pip check
      - name: Capture exact resolved environment
        run: python -m pip freeze --all > "runtime-freeze-${{ matrix.runtime }}.txt"
      - name: Generate strict runtime license inventory
        run: >-
          python scripts/dependency-license-report.py
          --overrides legal/LICENSE_OVERRIDES.json
          --output "runtime-licenses-${{ matrix.runtime }}.json"
          --fail-on-risk --fail-on-unknown
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-licenses-${{ matrix.runtime }}
          path: |
            runtime-licenses-${{ matrix.runtime }}.json
            runtime-freeze-${{ matrix.runtime }}.txt
          if-no-files-found: ignore
