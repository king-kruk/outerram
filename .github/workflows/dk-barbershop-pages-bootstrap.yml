name: Bootstrap D.K BarberShop Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dk-barbershop-pages-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hosting branch
        uses: actions/checkout@v4
        with:
          ref: dk-barbershop-host
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dk-barbershop
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
